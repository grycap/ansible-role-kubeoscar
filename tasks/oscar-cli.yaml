---
- name: Download oscar-cli
  block:
  - set_fact:
      oscar_cli_binary: "{{ 'oscar-cli-arm64' if ansible_architecture == 'aarch64' else 'oscar-cli' }}"
  - get_url:
      url: https://github.com/grycap/oscar-cli/releases/download/{{ oscar_cli_version }}/{{ oscar_cli_binary }}
      dest: /usr/bin/oscar-cli
      mode: '755'

- name: Set OSCAR endpoint
  block:
  - set_fact:
      oscar_has_dns: "{{ dns_host is defined and dns_host not in ['', \"''\"] }}"
  - set_fact:
      oscar_endpoint: "https://{{ dns_host }}"
    when:
      - create_ingress == true or create_httproute == true
      - oscar_has_dns
  - set_fact:
      oscar_endpoint: "https://{{ ansible_default_ipv4.address }}"
    when:
      - create_ingress == true or create_httproute == true
      - not oscar_has_dns
  - set_fact:
      oscar_endpoint: "http://{{ ansible_default_ipv4.address }}:{{ oscar_nodeport }}"
    when:
      - create_ingress == false
      - create_httproute == false
      - oscar_service_type == "NodePort"

- name: Add the cluster to oscar-cli
  shell:
    cmd: oscar-cli cluster add oscar-cluster {{ oscar_endpoint }} {{ oscar_user }} --password-stdin {{ "--disable-ssl" if not oscar_has_dns else "" }}
    stdin: "{{ oscar_pass }}"
  no_log: true
  when: oscar_endpoint is defined

- name: Warn when no OSCAR endpoint is configured
  debug:
    msg: >-
      No OSCAR endpoint could be derived (create_ingress and create_httproute disabled,
      service type '{{ oscar_service_type }}' is not NodePort), so the cluster was not
      added to oscar-cli.
  when: oscar_endpoint is not defined