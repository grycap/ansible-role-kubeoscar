---
- name: Generate random password for oscar_pass
  set_fact:
    oscar_pass: "{{ lookup('password', '/var/tmp/oscar_pass length=12 chars=ascii_letters,digits') }}"
  when: oscar_pass is not defined or oscar_pass == 'oscar123'
  no_log: true

- name: Generate random password for minio_secret_key
  set_fact:
    minio_secret_key: "{{ lookup('password', '/var/tmp/minio_secret_key length=12 chars=ascii_letters,digits') }}"
  when: minio_secret_key is not defined or minio_secret_key == 'minio123'
  no_log: true

- name: Install OSCAR
  import_tasks: oscar_helm.yaml

- name: Include monitoring tasks
  import_tasks: metrics.yaml
  when: metrics | bool

- name: Install KServe
  import_tasks: kserve.yaml
  when: kserve_enable | bool

- name: Install OSCAR-cli
  import_tasks: oscar-cli.yaml

- name: Apply Kueue configuration
  command: helm upgrade --install kueue oci://registry.k8s.io/kueue/charts/kueue  --version={{ kueue_version }}  --namespace  kueue-system  --create-namespace  --wait --timeout 300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  when: kueue_enable | bool

- name: Install calico
  import_tasks: calico.yaml