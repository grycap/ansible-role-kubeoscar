---
- name: Download Calico
  command: curl -fsSL "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml" | sed 's#192.168.0.0/16#10.244.0.0/16#g' > /var/tmp/calico.yaml;
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"


- name: Apply Calico
  command: kubectl apply -f /var/tmp/calico.yaml;
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"


- name: Wait for Calico to be ready
  command: kubectl -n kube-system rollout status daemonset/calico-node --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"




